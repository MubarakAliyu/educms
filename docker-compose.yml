services:
  postgres:
    image: postgres:16-alpine
    container_name: educms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: educms_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - educms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d educms_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: educms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - educms_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  educms_postgres_data:
  educms_redis_data:
